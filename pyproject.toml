[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "hyperos-notes-extractor"
version = "0.1.0"
description = "Export Xiaomi HyperOS / MIUI Notes to Markdown with images and voice recordings, via local backup. No root, no cloud."
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
authors = [{ name = "MoYu2008Fish" }]
keywords = ["xiaomi", "hyperos", "miui", "notes", "markdown", "backup", "export"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Utilities",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/MoYu2008Fish/hyperos-notes-extractor"
Issues = "https://github.com/MoYu2008Fish/hyperos-notes-extractor/issues"

[project.scripts]
hyperos-notes = "hyperos_notes_extract:main"

[tool.setuptools]
py-modules = ["hyperos_notes_extract"]
