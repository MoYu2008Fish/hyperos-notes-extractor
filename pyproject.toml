[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "notes-toolkit"
version = "0.2.0"
description = "Local toolkit to extract Xiaomi HyperOS / MIUI and ColorOS / realme notes to Markdown, and migrate HyperOS notes to ColorOS. No root, no cloud."
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
authors = [{ name = "notes-toolkit contributors" }]
keywords = ["xiaomi", "hyperos", "miui", "coloros", "realme", "notes", "markdown", "backup", "migration"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Utilities",
]
dependencies = []

[project.scripts]
hyperos-notes = "hyperos_notes_extract:main"
coloros-notes = "coloros_notes_extract:main"
hyperos-to-coloros = "hyperos_to_coloros_import:main"

[tool.setuptools]
py-modules = ["hyperos_notes_extract", "coloros_notes_extract", "hyperos_to_coloros_import"]
